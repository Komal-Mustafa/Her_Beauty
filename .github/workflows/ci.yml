name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hb
          POSTGRES_PASSWORD: hb
          POSTGRES_DB: herbeauty
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hb -d herbeauty"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hb:hb@localhost:5432/herbeauty
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate + seed database
        run: pnpm --filter @hb/db migrate:deploy && pnpm --filter @hb/db seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
        continue-on-error: true
